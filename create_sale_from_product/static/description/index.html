<!DOCTYPE html>
<html lang="en">
<div class="container">
    <div class="my-5">
    </div>
</div>
<!--    screenshots contents-->
<div class="mb-4 bg-white"
     style=" border: 1px solid #EBEEF2; border-radius: 6px; box-shadow: 0px 8px 20px -4px rgba(0, 0, 0, 0.10); border: 1px solid #EBEEF2;">
    <div>
        <ul class="nav nav-tabs justify-content-center bg-white py-2"
            id="myTab" role="tablist"
            style="border-radius: 6px 6px 0 0;">
            <li class="nav-item">
                <a aria-controls="overview"
                   aria-bs-selected="true"
                   class="nav-link active" data-bs-toggle="tab"
                   href="#overview" id="overview-tab" role="tab"
                   style="color:#121212; font-weight:500; font-size:16px">
                    Screenshots</a>
            </li>
        </ul>
    </div>

    <!-- screenshots section-->
    <div class="position-relative mb-4"
         style="border-radius:10px; background-color:#f4f4f4">
        <div class="p-md-5 p-3 position-relative">
            <div class="row">
                <div class="col-md-12">
                    <h1 style="font-weight:bold; font-size:calc(1.1rem + 1vw); line-height:120%; text-align:center; text-transform:capitalize; font-size: 40px;
                              font-weight: 700;">
                                      <span style="color:#121212; font-size:calc(1.1rem + 1vw)">Add Button in Actions
                                      </span>
                    </h1>
                </div>
                <div class="col-md-12 mb-4">
                    <p style="font-weight:400; font-size:16px; line-height:150%; text-align:center;  color:var(--text-color-light)">
                        Select product variants >> click Actions button and click to Create Sale Order action menu
                    </p>
                </div>
                <div class="col-md-12 text-center">
                    <div class="d-inline-block p-3 shadow-sm"
                         style="background-color:#fff; border-radius:10px">
                        <img alt="" class="img-fluid"
                             loading="lazy"
                             src="./img/image_1.png"
                             style="min-height: 1px;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="position-relative mb-4"
         style="border-radius:10px; background-color:#f4f4f4">
        <div class="p-md-5 p-3 position-relative">
            <div class="row">
                <div class="col-md-12">
                    <h1 style="font-weight:bold; font-size:calc(1.1rem + 1vw); line-height:120%; text-align:center; text-transform:capitalize; font-size: 40px;
                              font-weight: 700;">
                                      <span style="color:#121212; font-size:calc(1.1rem + 1vw)">Open Wizard
                                      </span>
                    </h1>
                </div>
                <div class="col-md-12 mb-4">
                    <p style="font-weight:400; font-size:16px; line-height:150%; text-align:center;  color:var(--text-color-light)">
                        add customer name ,order date , selected products
                        click create sale order
                    </p>
                </div>
                <div class="col-md-12 text-center">
                    <div class="d-inline-block p-3 shadow-sm"
                         style="background-color:#fff; border-radius:10px">
                        <img alt="" class="img-fluid"
                             loading="lazy"
                             src="./img/image_2.png"
                             style="min-height: 1px;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="position-relative mb-4"
         style="border-radius:10px; background-color:#f4f4f4">
        <div class="p-md-5 p-3 position-relative">
            <div class="row">
                <div class="col-md-12">
                    <h1 style="font-weight:bold; font-size:calc(1.1rem + 1vw); line-height:120%; text-align:center; text-transform:capitalize; font-size: 40px;
                              font-weight: 700;">
                                      <span style="color:#121212; font-size:calc(1.1rem + 1vw)">Create Sale order
                                      </span>
                    </h1>
                </div>
                <div class="col-md-12 mb-4">
                    <p style="font-weight:400; font-size:16px; line-height:150%; text-align:center;  color:var(--text-color-light)">
                        confirm the sale order
                    </p>
                </div>
                <div class="col-md-12 text-center">
                    <div class="d-inline-block p-3 shadow-sm"

                        <img alt="" class="img-fluid"
                             loading="lazy"
                             src="./img/image_3.png"
                             style="min-height: 1px;">
                    </div>
                </div>
            </div>
        </div>
